<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReHaB Pub Quiz Nights</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 3rem 1.5rem; gap: 2rem; }
    .logo-mark { font-size: 4rem; margin-bottom: .5rem; }
    .hero h1 span { color: var(--accent); }
    .hero p { max-width: 460px; font-size: 1.05rem; }
    .join-card { width: 100%; max-width: 400px; }
    .join-row { display: flex; gap: .5rem; }
    .join-row input { font-size: 1.1rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; text-align: center; }
    .divider-text { display: flex; align-items: center; gap: 1rem; color: var(--muted); font-size: .8rem; }
    .divider-text::before, .divider-text::after { content:''; flex:1; height:1px; background: var(--border); }
    .footer { padding: 1rem; text-align: center; color: var(--muted); font-size: .8rem; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-logo">
      <img src="/images/logo-crop.png" alt="ReHaB Pub" onerror="this.style.display='none'" style="height:24px;width:auto;object-fit:contain;display:block">
      ReHaB Pub Quiz Nights
    </a>
    <div class="nav-links">
      <a href="/admin" class="btn btn-ghost btn-sm" style="color:var(--accent)"><span>Admin</span> <img src="/images/settings.png" alt="" style="height:16px;width:auto;vertical-align:middle"></a>
    </div>
  </nav>

  <div class="hero">
    <div class="hero">
      <div class="logo-mark">
        <img src="/images/logo-crop.png" alt="ReHaB Pub Logo" onerror="this.style.display='none'" style="height:280px;width:auto;object-fit:contain">
        <!-- <img src="/images/quiz-nights.png" alt="Quiz Nights" onerror="this.style.display='none'"> -->
      </div>

      <div class="hero-content">

        <h1>
          ReHaB Pub
          <span>Quiz Nights</span>
        </h1>

        <p>
          Challenge your friends, join live quiz games, and climb the leaderboard.
        </p>
      </div>
    </div>

    <div class="card join-card">
      <h3 class="text-center mt-1">Join a Game</h3>
      <p class="text-center mt-1">Enter the room code shown on the host screen</p>
      <div class="stack mt-2">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" id="playerName" placeholder="Enter your name" maxlength="24">
        </div>
        <div class="form-group">
          <label>Room Code</label>
          <input type="text" id="roomCode" placeholder="ABC123" maxlength="6">
        </div>
        <button class="btn btn-primary btn-lg full-width" onclick="joinGame()">Join Game →</button>
      </div>
      <div class="divider-text mt-3">or</div>
      <div class="stack mt-2">
        <a href="/admin" class="btn btn-ghost full-width"><img src="/images/settings.png" alt="" style="height:16px;width:auto;vertical-align:middle"> Manage Quizzes (Admin)</a>
      </div>
    </div>
  </div>

  <footer class="footer" id="appFooter"></footer>

  <script>
    const APP_VERSION = '1.0';
    document.getElementById('appFooter').textContent = `ReHaB Pub Quiz Nights · v${APP_VERSION}`;

    document.getElementById('roomCode').addEventListener('input', e => {
      e.target.value = e.target.value.toUpperCase();
    });
    document.getElementById('roomCode').addEventListener('keydown', e => {
      if (e.key === 'Enter') joinGame();
    });
    function joinGame() {
      const name = document.getElementById('playerName').value.trim();
      const code = document.getElementById('roomCode').value.trim().toUpperCase();
      if (!name) { toast('Please enter your name', 'warning'); document.getElementById('playerName').focus(); return; }
      if (!code) { toast('Please enter a room code', 'warning'); document.getElementById('roomCode').focus(); return; }
      window.location.href = `/play?code=${code}&name=${encodeURIComponent(name)}`;
    }

    function toast(msg, type = 'info') {
      let stack = document.getElementById('toastStack');
      if (!stack) {
        stack = Object.assign(document.createElement('div'), { id: 'toastStack', className: 'toast-stack' });
        document.body.appendChild(stack);
      }
      const el = Object.assign(document.createElement('div'), { className: `toast ${type}`, textContent: msg });
      stack.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0'; el.style.transform = 'translateX(20px)';
        setTimeout(() => el.remove(), 240);
      }, 3200);
    }
  </script>
</body>
</html>
